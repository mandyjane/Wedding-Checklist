<style>
  :root {
    --bg: #faf7f2;
    --bg2: #f2ede5;
    --text: #2c2416;
    --text2: #a09080;
    --text3: #c8bfb0;
    --border: #e0d5c7;
    --accent: #b8977a;
    --accent2: #a07d60;
    --green: #5a8a5a;
    --green-bg: #e8f0e8;
    --red: #d94040;
    --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --serif: 'Georgia', 'Times New Roman', serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1612;
      --bg2: #252018;
      --text: #e8e0d4;
      --text2: #8a7e70;
      --text3: #4a4238;
      --border: #3a3228;
      --accent: #c4a482;
      --accent2: #d4b492;
      --green: #6a9a6a;
      --green-bg: #1e2a1e;
      --red: #e05050;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

  /* Header */
  .header {
    text-align: center;
    padding-bottom: 24px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .header .countdown {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 8px;
  }
  .header h1 {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 400;
    font-style: italic;
    margin-bottom: 4px;
  }
  .header .venue {
    font-size: 13px;
    color: var(--text2);
  }

  /* Sync bar */
  .sync-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    margin-bottom: 20px;
    background: var(--bg2);
    border-radius: 10px;
    font-size: 12px;
    color: var(--text2);
    gap: 8px;
  }
  .sync-bar button {
    font-size: 11px;
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text2);
    cursor: pointer;
    white-space: nowrap;
  }
  .sync-bar button:active { opacity: 0.7; }
  .sync-status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Progress */
  .progress { margin-bottom: 24px; }
  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .progress-label { font-size: 13px; color: var(--text2); }
  .progress-pct { font-size: 22px; font-weight: 300; }
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* Filters */
  .filters { display: flex; gap: 8px; margin-bottom: 24px; }
  .filter-btn {
    padding: 5px 14px;
    font-size: 12px;
    font-family: var(--font);
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  /* Sections */
  .section { margin-bottom: 12px; }
  .section-header {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .section-toggle {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border: none;
    background: transparent;
    cursor: pointer;
    text-align: left;
    font-family: var(--font);
    color: var(--text);
  }
  .section-title { font-size: 15px; font-weight: 600; }
  .section-count {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 10px;
    background: var(--bg2);
    color: var(--text2);
  }
  .section-count.done { background: var(--green-bg); color: var(--green); }
  .section-remove {
    border: none;
    background: transparent;
    font-size: 14px;
    padding: 4px 8px;
    color: var(--text3);
    cursor: pointer;
    line-height: 1;
    margin-left: 4px;
    border-radius: 4px;
  }
  .section-remove:active { opacity: 0.5; }

  /* Items */
  .items { padding-top: 4px; }
  .item {
    display: flex;
    align-items: flex-start;
  }
  .item label {
    display: flex;
    gap: 10px;
    padding: 8px 4px;
    cursor: pointer;
    flex: 1;
    align-items: flex-start;
  }
  .item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin-top: 1px;
    cursor: pointer;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .item-text {
    font-size: 14px;
    line-height: 1.5;
    transition: color 0.2s;
  }
  .item-text.checked {
    color: var(--text3);
    text-decoration: line-through;
  }
  .item-remove {
    border: none;
    background: transparent;
    font-size: 12px;
    padding: 10px 6px;
    color: var(--text3);
    cursor: pointer;
    flex-shrink: 0;
    line-height: 1;
  }

  /* Confirm */
  .confirm-btns {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 8px 0;
    flex-shrink: 0;
  }
  .confirm-btns button {
    font-size: 10px;
    padding: 3px 8px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--font);
  }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-muted { background: var(--bg2); color: var(--text2); }

  /* Add task */
  .add-task-btn {
    border: none;
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    font-family: var(--font);
    padding: 8px 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .add-task-btn span { font-size: 16px; line-height: 1; }

  .add-form {
    display: flex;
    gap: 8px;
    padding: 8px 4px;
    align-items: center;
  }
  .add-form input {
    flex: 1;
    padding: 8px 12px;
    font-size: 14px;
    font-family: var(--font);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    background: var(--bg);
    color: var(--text);
  }
  .add-form input:focus { border-color: var(--accent); }
  .btn-accent {
    border: none;
    padding: 8px 16px;
    font-size: 13px;
    font-family: var(--font);
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-text {
    border: none;
    padding: 8px 12px;
    font-size: 13px;
    font-family: var(--font);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
  }

  /* Add section */
  .add-section-area {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  /* Setup modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal {
    background: var(--bg);
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 420px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .modal p { font-size: 13px; color: var(--text2); margin: 8px 0; line-height: 1.6; }
  .modal label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin: 16px 0 6px; }
  .modal input[type="text"], .modal input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    font-family: var(--font);
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    justify-content: flex-end;
  }
  .modal code {
    font-size: 12px;
    background: var(--bg2);
    padding: 2px 6px;
    border-radius: 4px;
    word-break: break-all;
  }
  .modal ol {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.8;
    padding-left: 20px;
    margin: 8px 0;
  }

  .footer {
    text-align: center;
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: var(--text3);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>

// ─── App State ───
let state = {
  sections: JSON.parse(JSON.stringify(DEFAULT_SECTIONS)),
  checked: {},
  expanded: {},
  filter: 'all',
  addingTo: null,
  confirmDelete: null,
  confirmDeleteSection: null,
  showAddSection: false,
  showSetup: false,
};

// ─── GitHub Storage ───
function getGitHubConfig() {
  try {
    return JSON.parse(localStorage.getItem('gh_config') || 'null');
  } catch { return null; }
}

function setGitHubConfig(config) {
  localStorage.setItem('gh_config', JSON.stringify(config));
}

function getSyncStatus() {
  return localStorage.getItem('sync_status') || 'Not connected';
}
function setSyncStatus(s) {
  localStorage.setItem('sync_status', s);
}

async function ghSave(data) {
  const cfg = getGitHubConfig();
  if (!cfg) return;

  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const url = `https://api.github.com/repos/${cfg.repo}/contents/${cfg.path}`;

  try {
    // Get current file SHA
    let sha = null;
    try {
      const existing = await fetch(url, {
        headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (existing.ok) {
        const json = await existing.json();
        sha = json.sha;
      }
    } catch {}

    const body = {
      message: 'Update wedding checklist',
      content: content,
    };
    if (sha) body.sha = sha;

    const res = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${cfg.token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify(body)
    });

    if (res.ok) {
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      setSyncStatus(`Synced at ${now}`);
    } else {
      const err = await res.json();
      setSyncStatus(`Sync failed: ${err.message || res.status}`);
    }
  } catch (e) {
    setSyncStatus(`Sync failed: ${e.message}`);
  }
  render();
}

async function ghLoad() {
  const cfg = getGitHubConfig();
  if (!cfg) return null;

  const url = `https://api.github.com/repos/${cfg.repo}/contents/${cfg.path}`;
  try {
    const res = await fetch(url, {
      headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!res.ok) {
      if (res.status === 404) {
        setSyncStatus('Connected — no data yet');
        return null;
      }
      setSyncStatus(`Load failed: ${res.status}`);
      return null;
    }
    const json = await res.json();
    const decoded = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ''))));
    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    setSyncStatus(`Synced at ${now}`);
    return JSON.parse(decoded);
  } catch (e) {
    setSyncStatus(`Load failed: ${e.message}`);
    return null;
  }
}

// ─── Local storage fallback ───
function saveLocal() {
  const data = { sections: state.sections, checked: state.checked };
  localStorage.setItem('wedding_local', JSON.stringify(data));
  ghSave(data); // async, fire-and-forget
}

function loadLocal() {
  try {
    return JSON.parse(localStorage.getItem('wedding_local') || 'null');
  } catch { return null; }
}

// ─── Toast ───
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ─── Helper ───
function genId() { return 'c-' + Date.now() + '-' + Math.random().toString(36).slice(2,6); }

function getDaysUntil() {
  return Math.ceil((new Date(2026, 9, 14) - new Date()) / (1000*60*60*24));
}

function getStats(section) {
  const total = section.items.length;
  const done = section.items.filter(i => state.checked[i.id]).length;
  return { total, done };
}

// ─── Render ───
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function render() {
  const totalItems = state.sections.reduce((s,c) => s + c.items.length, 0);
  const doneItems = Object.values(state.checked).filter(Boolean).length;
  const pct = totalItems > 0 ? Math.round((doneItems/totalItems)*100) : 0;
  const days = getDaysUntil();
  const cfg = getGitHubConfig();
  const syncStatus = getSyncStatus();

  let filtered = state.sections.map(section => {
    if (state.filter === 'all') return section;
    const items = section.items.filter(i =>
      state.filter === 'done' ? state.checked[i.id] : !state.checked[i.id]
    );
    return { ...section, items };
  }).filter(s => state.filter === 'all' || s.items.length > 0);

  let html = '';

  // Header
  html += `<div class="header">
    <div class="countdown">${days > 0 ? days + ' days to go' : days === 0 ? "Today's the day!" : 'Congratulations!'}</div>
    <h1>Wedding Checklist</h1>
    <div class="venue">14 October 2026 · Hillstone St Lucia</div>
  </div>`;

  // Sync bar
  html += `<div class="sync-bar">
    <span class="sync-status">${cfg ? esc(syncStatus) : 'Local only — connect GitHub to sync'}</span>
    <button onclick="openSetup()">⚙ ${cfg ? 'Settings' : 'Connect GitHub'}</button>
    ${cfg ? '<button onclick="doSync()">↻ Sync</button>' : ''}
  </div>`;

  // Progress
  html += `<div class="progress">
    <div class="progress-top">
      <span class="progress-label">${doneItems} of ${totalItems} tasks</span>
      <span class="progress-pct" style="color:${pct===100?'var(--green)':'var(--text)'}">${pct}%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;${pct===100?'background:var(--green)':''}"></div></div>
  </div>`;

  // Filters
  html += `<div class="filters">
    ${['all','pending','done'].map(f => `
      <button class="filter-btn${state.filter===f?' active':''}" onclick="setFilter('${f}')">${f==='all'?'All':f==='pending'?'To do':'Done'}</button>
    `).join('')}
  </div>`;

  // Sections
  filtered.forEach(section => {
    const orig = state.sections.find(s => s.id === section.id);
    const stats = getStats(orig);
    const exp = state.expanded[section.id] !== false;

    html += `<div class="section">`;
    html += `<div class="section-header">`;
    html += `<button class="section-toggle" onclick="toggleSection('${section.id}')">
      <span class="section-title">${exp?'▾':'▸'} ${esc(section.title)}</span>
      <span class="section-count${stats.done===stats.total&&stats.total>0?' done':''}">${stats.done}/${stats.total}</span>
    </button>`;

    if (state.confirmDeleteSection === section.id) {
      html += `<div class="confirm-btns">
        <button class="btn-danger" onclick="removeSection('${section.id}')">Remove</button>
        <button class="btn-muted" onclick="cancelDeleteSection()">Keep</button>
      </div>`;
    } else {
      html += `<button class="section-remove" onclick="confirmDeleteSection('${section.id}')" title="Remove section">✕</button>`;
    }
    html += `</div>`;

    if (exp) {
      html += `<div class="items">`;
      section.items.forEach(item => {
        const chk = state.checked[item.id];
        html += `<div class="item">
          <label>
            <input type="checkbox" ${chk?'checked':''} onchange="toggleItem('${item.id}')">
            <span class="item-text${chk?' checked':''}">${esc(item.text)}</span>
          </label>`;

        if (state.confirmDelete === item.id) {
          html += `<div class="confirm-btns">
            <button class="btn-danger" onclick="removeItem('${section.id}','${item.id}')">Yes</button>
            <button class="btn-muted" onclick="cancelDelete()">No</button>
          </div>`;
        } else {
          html += `<button class="item-remove" onclick="confirmDeleteItem('${item.id}')" title="Remove">✕</button>`;
        }
        html += `</div>`;
      });

      if (state.addingTo === section.id) {
        html += `<div class="add-form">
          <input type="text" id="newItemInput" placeholder="Type a new task..." onkeydown="handleAddKey(event,'${section.id}')">
          <button class="btn-accent" onclick="addItem('${section.id}')">Add</button>
          <button class="btn-text" onclick="cancelAdd()">Cancel</button>
        </div>`;
      } else {
        html += `<button class="add-task-btn" onclick="startAdd('${section.id}')"><span>+</span> Add task</button>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  });

  // Add section
  html += `<div class="add-section-area">`;
  if (state.showAddSection) {
    html += `<div class="add-form">
      <input type="text" id="newSectionInput" placeholder="New section name..." onkeydown="handleAddSectionKey(event)">
      <button class="btn-accent" onclick="addSection()">Add</button>
      <button class="btn-text" onclick="cancelAddSection()">Cancel</button>
    </div>`;
  } else {
    html += `<button class="add-task-btn" onclick="startAddSection()"><span>+</span> Add new section</button>`;
  }
  html += `</div>`;

  html += `<div class="footer">✓ Changes save locally and sync to GitHub</div>`;

  // Setup modal
  if (state.showSetup) {
    const c = cfg || {};
    html += `<div class="modal-overlay" onclick="if(event.target===this)closeSetup()">
      <div class="modal">
        <h2>GitHub Sync</h2>
        <p>Your data saves to <code>data/checklist.json</code> in this same repo.</p>
        <ol>
          <li>Go to <strong>GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens</strong></li>
          <li>Create a token scoped to your <code>wedding-checklist</code> repo with <strong>Contents: Read and write</strong></li>
        </ol>
        <label>Repository (owner/repo)</label>
        <input type="text" id="ghRepo" placeholder="yourname/wedding-checklist" value="${esc(c.repo||'')}">
        <label>File path</label>
        <input type="text" id="ghPath" value="${esc(c.path||'data/checklist.json')}" style="color:var(--text2)">
        <label>Personal access token</label>
        <input type="password" id="ghToken" placeholder="github_pat_..." value="${esc(c.token||'')}">
        <div class="modal-actions">
          ${cfg ? '<button class="btn-text" onclick="disconnectGH()" style="margin-right:auto;color:var(--red)">Disconnect</button>' : ''}
          <button class="btn-text" onclick="closeSetup()">Cancel</button>
          <button class="btn-accent" onclick="saveSetup()">Save & Sync</button>
        </div>
      </div>
    </div>`;
  }

  document.getElementById('app').innerHTML = html;

  // Auto-focus inputs
  if (state.addingTo) {
    const el = document.getElementById('newItemInput');
    if (el) el.focus();
  }
  if (state.showAddSection) {
    const el = document.getElementById('newSectionInput');
    if (el) el.focus();
  }
}

// ─── Actions ───
window.setFilter = f => { state.filter = f; render(); };
window.toggleSection = id => { state.expanded[id] = state.expanded[id] === false ? true : false; render(); };

window.toggleItem = id => {
  state.checked[id] = !state.checked[id];
  saveLocal();
  render();
};

window.confirmDeleteItem = id => { state.confirmDelete = id; render(); };
window.cancelDelete = () => { state.confirmDelete = null; render(); };
window.removeItem = (secId, itemId) => {
  const sec = state.sections.find(s => s.id === secId);
  if (sec) sec.items = sec.items.filter(i => i.id !== itemId);
  delete state.checked[itemId];
  state.confirmDelete = null;
  saveLocal();
  render();
};

window.confirmDeleteSection = id => { state.confirmDeleteSection = id; render(); };
window.cancelDeleteSection = () => { state.confirmDeleteSection = null; render(); };
window.removeSection = id => {
  const sec = state.sections.find(s => s.id === id);
  if (sec) sec.items.forEach(i => delete state.checked[i.id]);
  state.sections = state.sections.filter(s => s.id !== id);
  state.confirmDeleteSection = null;
  saveLocal();
  render();
};

window.startAdd = secId => { state.addingTo = secId; render(); };
window.cancelAdd = () => { state.addingTo = null; render(); };
window.addItem = secId => {
  const input = document.getElementById('newItemInput');
  const text = input?.value?.trim();
  if (!text) return;
  const sec = state.sections.find(s => s.id === secId);
  if (sec) sec.items.push({ id: genId(), text });
  state.addingTo = null;
  saveLocal();
  render();
};
window.handleAddKey = (e, secId) => {
  if (e.key === 'Enter') addItem(secId);
  if (e.key === 'Escape') cancelAdd();
};

window.startAddSection = () => { state.showAddSection = true; render(); };
window.cancelAddSection = () => { state.showAddSection = false; render(); };
window.addSection = () => {
  const input = document.getElementById('newSectionInput');
  const name = input?.value?.trim();
  if (!name) return;
  const id = 'sec-' + Date.now();
  state.sections.push({ id, title: name, items: [] });
  state.expanded[id] = true;
  state.showAddSection = false;
  saveLocal();
  render();
};
window.handleAddSectionKey = e => {
  if (e.key === 'Enter') addSection();
  if (e.key === 'Escape') cancelAddSection();
};

// ─── Setup modal ───
window.openSetup = () => { state.showSetup = true; render(); };
window.closeSetup = () => { state.showSetup = false; render(); };

window.saveSetup = async () => {
  const repo = document.getElementById('ghRepo')?.value?.trim();
  const path = document.getElementById('ghPath')?.value?.trim() || 'checklist.json';
  const token = document.getElementById('ghToken')?.value?.trim();

  if (!repo || !token) {
    showToast('Please fill in repo and token');
    return;
  }

  setGitHubConfig({ repo, path, token });
  setSyncStatus('Connecting...');
  state.showSetup = false;
  render();

  // Try to load remote data
  const remote = await ghLoad();
  if (remote && remote.sections) {
    state.sections = remote.sections;
    state.checked = remote.checked || {};
    localStorage.setItem('wedding_local', JSON.stringify(remote));
    showToast('Loaded from GitHub');
  } else {
    // Push local data to GitHub
    await ghSave({ sections: state.sections, checked: state.checked });
    showToast('Connected & synced');
  }
  render();
};

window.disconnectGH = () => {
  localStorage.removeItem('gh_config');
  setSyncStatus('Not connected');
  state.showSetup = false;
  showToast('GitHub disconnected');
  render();
};

window.doSync = async () => {
  setSyncStatus('Syncing...');
  render();
  const remote = await ghLoad();
  if (remote && remote.sections) {
    state.sections = remote.sections;
    state.checked = remote.checked || {};
    localStorage.setItem('wedding_local', JSON.stringify(remote));
    showToast('Synced from GitHub');
  }
  render();
};

// ─── Init ───
async function init() {
  // Load local first (instant)
  const local = loadLocal();
  if (local) {
    state.sections = local.sections || state.sections;
    state.checked = local.checked || {};
  }
  render();

  // Then try GitHub
  const cfg = getGitHubConfig();
  if (cfg) {
    const remote = await ghLoad();
    if (remote && remote.sections) {
      state.sections = remote.sections;
      state.checked = remote.checked || {};
      localStorage.setItem('wedding_local', JSON.stringify(remote));
    }
    render();
  }
}

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

init();
</script>
